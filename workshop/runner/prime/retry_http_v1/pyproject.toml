[project]
name = "retry-http-v1"
version = "1.0.0"
description = "Fixed retry-safe HTTP Taskset and local Pi harness for the workshop."
requires-python = ">=3.11,<3.14"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retry_http_v1"]
